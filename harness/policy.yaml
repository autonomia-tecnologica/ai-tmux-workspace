# Central capability policy: one engine, two adapters (Claude Code hook and OpenCode plugin).
#
# `default: deny` is the fail-closed rule for anything the classifier cannot place. Roles are
# relative to a session box: `WS_SESSION_ROLE` says which one applies and `WS_SESSION_ROOT` is the
# box root. `/tmp` is the only global area inside every box. The declared root wins over the
# configuration roots (`~/.config`, `~/.claude`, the installed workspace), so a worktree under one
# of them is still its own writable repo; secrets win over the root.
#
# `subagent` does not own capabilities: it inherits the parent role and may only tighten an entry.
# An inherited value more permissive than the parent's is ignored by the engine.
#
# `workspace.read`/`workspace.write` are the workspace's own code (the clone or installed copy at
# WS_DIR). The engine resolves them before this table: reading is allowed for every role; writing is
# denied for repo/home/sibling and allowed only when the session box (WS_SESSION_ROOT) is inside the
# workspace root. The values below are the declared defaults, not the decision.
#
# Decisions: allow runs without asking; ask waits for the person; deny never runs. `auto` (read
# from WS_POLICY_AUTO or the event permission_mode) only turns `ask` into `allow` for path-scoped
# capabilities whose target is inside the box, and never touches `deny`.
#
# A shell program no table knows is not classified here: it defers to the session's mode (item 135),
# so the table has nothing to list for it. `deny` stays for what is known to be serious: admin
# (sudo, pkexec, su, doas), secrets, paths outside the box and the workspace code.
version: 1
default: deny
roles:
  repo:
    repo.read: allow
    repo.write: allow
    repo.outside: deny
    workspace.read: allow
    workspace.write: deny
    vcs.read: allow
    vcs.write: allow
    vcs.remote: ask
    test.run: allow
    net: allow
    install: allow
    admin: deny
    config.read: allow
    config.write: deny
    tmp: allow
    secrets: deny
    session.external: ask
  home:
    repo.read: allow
    repo.write: allow
    repo.outside: allow
    workspace.read: allow
    workspace.write: deny
    vcs.read: allow
    vcs.write: allow
    vcs.remote: ask
    test.run: allow
    net: ask
    install: ask
    admin: deny
    config.read: allow
    config.write: allow
    tmp: allow
    secrets: deny
    session.external: ask
  # `self` is the workspace's dev session (`workspace dev`): it takes the table of `repo` as is, and
  # the workspace code is still decided by the protected-path rule above (write only from its box).
  self:
    inherits: repo
  subagent:
    inherits: parent
