# Config do workspace. Copie para ~/.config/ai-tmux-workspace/config.yaml (ou rode ./install.sh).
# Só estrutura, sem dado pessoal. Caminhos aceitam ~. AT_WS_CONFIG troca o caminho do arquivo.
# Sintaxe: o subconjunto de YAML de src/yaml_min.py (mapas, listas, escalares, comentários com #).

notifications: true
extra_usage: false
icons: true

# O workspace gerencia as opções do agente (settings gerada, modo de permissão e hooks).
# `manage: false` deixa o agente como está: nenhuma settings é gerada, nenhum hook é registrado e o
# `claude` sobe puro (sem --settings, --permission-mode nem ENABLE_TOOL_SEARCH=false).
manage: true

# O workspace gerencia o HARNESS.md instalado em ~/.local/share/ai-tmux-workspace/harness.
# `manage: true` implica `harness_managed: true` (o hook SessionStart já injeta o HARNESS.md).
# Com `manage: false` e `harness_managed: true`, o instalador copia o harness e aponta para ele em
# ~/.claude/CLAUDE.md: é o `claude` bruto com o HARNESS.md apontado, sem settings nem hooks.
# `harness_managed: false`: nada é instalado em nenhum dos dois lugares. Sem a chave, o padrão é true.
harness_managed: true

# Perfil padrão das novas sessões (usado quando uma sessão é aberta sem escolha, ex.: prompt de
# tarefa). Mudar este valor não reinicia o workspace; só vale para as sessões abertas depois.
agent: claude

# Editores do menu ao abrir um arquivo pelo painel. O tipo vem da extensão: prosa (md, markdown,
# mdx, rst, txt) e código (todo o resto). Só entram os comandos que existem no PATH.
# `fullscreen: true` abre o popup em 100%x100%; sem a chave, 92%x92%.
# Sem esta chave: prosa usa micro e nvim; código usa nvim e micro.
editor:
  prose:
    - name: micro
      command: micro
      fullscreen: true
    - name: nvim
      command: nvim
      fullscreen: false
  code:
    - name: nvim
      command: nvim
      fullscreen: false
    - name: micro
      command: micro
      fullscreen: false

# Perfis. Esta lista é a lista de perfis aprovados mostrada no menu `+` da tira de sessões. O valor
# pode ser a linha de comando (formato antigo, ex. `claude`) ou um mapa com
# `command` e `settings`. Com `manage: true`, o workspace gera a settings de cada perfil do harness
# do Claude e sobe o comando com `--settings`: a base traz os hooks e o `deny` do harness; `settings`
# traz só a parte do perfil (URL, modelos, flags, apiKeyHelper). Com `manage: false`, nada disso é
# gerado e o comando do perfil roda como está. Chave de acesso nunca entra aqui nem na settings
# gerada: use um comando de cofre em `apiKeyHelper` (o Claude Code executa na hora de subir).
#
# `harness: opencode` sobe o `opencode` em vez do Claude Code, sem nenhuma flag/settings/hook do
# Claude. `command` é opcional (padrão `opencode`). `config` é o arquivo do OpenCode daquele perfil,
# exportado como `OPENCODE_CONFIG` (o OpenCode mescla com a config global). A abertura tenta
# `--continue` para pegar a última sessão do repo e cai para sessão nova se não houver.
# Conferência, «Perguntar ao Claude», painel SESSÕES e métricas do status bar degradam com aviso
# nesse harness.
profiles:
  claude: claude
  claude-deepseek:
    command: claude
    settings:
      env:
        ANTHROPIC_BASE_URL: https://api.deepseek.com/anthropic
        ANTHROPIC_MODEL: deepseek-flash
        # slot Opus: o modelo mais forte, escolhido com /model opus
        ANTHROPIC_DEFAULT_OPUS_MODEL: deepseek-v4-pro
        ANTHROPIC_DEFAULT_SONNET_MODEL: deepseek-flash
        ANTHROPIC_DEFAULT_HAIKU_MODEL: deepseek-flash
        CLAUDE_CODE_SUBAGENT_MODEL: deepseek-flash
        CLAUDE_CODE_MAX_CONTEXT_TOKENS: "1000000"
        DISABLE_TELEMETRY: "1"
        DISABLE_ERROR_REPORTING: "1"
      model: deepseek-flash
      apiKeyHelper: "pass show deepseek/api-key"   # exemplo: aponte para o seu cofre
  opencode-deepseek:                             # harness do OpenCode, API do DeepSeek
    harness: opencode
    command: opencode
    config: ~/.config/ai-tmux-workspace/opencode-deepseek.json
    model: deepseek/deepseek-flash
  # mesmo harness, outro arquivo de config: o provedor `opencode` tem modelos free (ex.:
  # `opencode/deepseek-v4.1-flash-free`); o perfil acima aponta para a API do DeepSeek.
  opencode-free:
    harness: opencode
    command: opencode
    config: ~/.config/ai-tmux-workspace/opencode-free.json
    model: opencode/deepseek-v4.1-flash-free

prompts:
  - "Quero limpar a sessão. Decisões em aberto e trabalhos realizados estão persistidos?"
  - "Você me enviou muito texto. Tem alguma dúvida? Se sim, me pergunte com enquetes individuais, com a pergunta direto na enquete."
  - "Implemente o máximo de tarefas já refinadas que podem ser paralelizadas."
  - "Quero refinar TODAS as tarefas pendentes no backlog, exceto as pausadas (PAUSADA). Me pergunte cada coisa em uma enquete separada, e toda enquete precisa ter as opções \"Remover\" e \"Pausar\" (para eu descartar ou pausar o item). Envie por lotes, mas não me espere para enviar cada lote."
  - "Já validei todas as tarefas pendentes a validar, pode removê-las."

options:
  - label: Ask Claude
    children:
      - label: Sonnet
        ask: sonnet
  - label: Git status
    run: git status -sb

# Repo principal: fica fora dos grupos, sempre no topo da lista.
main: ~/Codes/main-repo

# Categorias (grupos) de repos. Cada entrada é um caminho, ou um mapa com "path" e "siblings".
# "siblings" declara irmãos: a relação é simétrica (vale dos dois lados).
groups:
  Example:
    - ~/Codes/some-repo
    - path: ~/Codes/other-repo
      siblings:
        - ~/Codes/some-repo

# Pasta-mãe (opcional, descomentar para usar): todo repo listado (main ou groups) que estiver dentro dela
# é irmão de todos os outros listados dentro dela, sem precisar de "siblings". Fora dela, valem só os "siblings".
# parent_folder: ~/Codes/my-folder

# Relações nomeadas: agrupamento por relacionamento, independente de "groups". Não abre janelas.
relations:
  Pair:
    - ~/Codes/some-repo
    - ~/Codes/other-repo

plugins:
  claude: []
