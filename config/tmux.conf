# Config do tmux do workspace (socket próprio: não mexe no seu tmux normal).
# Lida por `workspace`; WS_PERFIL e WS_DIR são exportados por `workspace` antes de ler este arquivo.

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"
set -g mouse on
set -g escape-time 10
set -g history-limit 50000
set -g base-index 1
set -g renumber-windows on
set -g automatic-rename off
set -g allow-rename off
set -g focus-events on

# bordas e barra de status (em cima)
set -g pane-border-style "fg=colour238"
# ctrl+b pressionado: tudo vira laranja (borda, título do painel, barra) até a próxima tecla
# focus is shown by a subtle background tint on the active pane (blue; dark orange while ctrl+b/nav is active), and the same tint on the borders around it
set -g pane-active-border-style "fg=colour238,#{?#{||:#{client_prefix},#{==:#{client_key_table},nav}},bg=#2f1d0e,bg=#0f2339}"
set -g window-active-style "#{?#{||:#{client_prefix},#{==:#{client_key_table},nav}},bg=#2f1d0e,bg=#0f2339}"
set -g pane-border-lines heavy
set -g pane-border-status off   # each panel has its own top bar; without status rows the borders are shared lines and light up on both sides
set -g pane-border-indicators off
set -g status on
set -g status-position top
set -g status-interval 5
set -g status-style "bg=colour235,fg=colour250"
set -g status-justify left
set -g status-left-length 200
set -g status-left "#{?#{==:#{client_key_table},nav},#[bg=colour208 fg=colour16 bold] NAVEGAR · ←→↑↓ move o foco · Enter/Esc sai #[default] ,#{?client_prefix,#[bg=colour208 fg=colour16 bold] PREFIXO · setas navegar  z zoom  t nova aba  n/p troca  h ajuda #[default] ,}}#(python3 ${WS_DIR}/src/statusbar.py '#{@ws_repo}' '#{@ws_perfil}')"
set -g status-right-length 60
set -g status-right "#[fg=colour240]#[fg=colour250,bold]ctrl+b#[nobold,fg=colour244] mostra as opções · #[fg=colour250,bold]ctrl+b h#[nobold,fg=colour244] ajuda #[default]"
set -g window-status-format ""
set -g window-status-current-format ""
set -g window-status-separator ""

# lado direito: a barra do topo (ARQUIVOS SESSÕES DIFF GITHUB) troca por clique, ou com o foco nela (ctrl+b + seta): ←→ move, Enter ativa
# abas temporárias do Claude e do terminal (tira acima de cada um, com +; t/n/p valem para o painel em foco): clique troca/cria · ctrl+b t cria · foco na tira (ctrl+b ↑, Esc): ←→ move, Enter ativa · ctrl+b n/p troca
bind t run-shell "${WS_DIR}/bin/workspace tab-new '#{window_id}' '#{@papel}'"
bind n run-shell "${WS_DIR}/bin/workspace tab-step '#{window_id}' 1 '#{@papel}'"
bind p run-shell "${WS_DIR}/bin/workspace tab-step '#{window_id}' -1 '#{@papel}'"
# ctrl+b r recarrega este tmux.conf e a tira de abas sem sair (equivale a `workspace reload`)
bind r run-shell -b "${WS_DIR}/bin/workspace reload '#{@ws_perfil}' >/dev/null 2>&1" \; display-message "reloaded"
# popups (help, diff, file view) are not panes, so window-active-style does not reach them: give them an explicit
# background, otherwise they show the terminal theme background (light gray on some setups)
set -g popup-style "bg=#0f2339,fg=colour252"
set -g popup-border-style "fg=colour244"
# ctrl+b h opens HELP.md rendered in a read-only, scrollable popup (Esc or q closes)
bind h display-popup -E -w 92% -h 92% -d "${WS_DIR}" "python3 ${WS_DIR}/src/help.py"
# Fit pane sizes when a client attaches or the terminal is resized (no manual reload needed).
set-hook -g client-attached "run-shell -b \"${WS_DIR}/bin/workspace fit '#{@ws_perfil}' >/dev/null 2>&1\""
set-hook -g client-resized "run-shell -b \"${WS_DIR}/bin/workspace fit '#{@ws_perfil}' >/dev/null 2>&1\""
# ctrl+b + seta entra no modo NAVEGAR: as setas seguem movendo o foco (sem soltar o prefixo
# a cada vez, e sem o painel focado roubar as setas). Enter/Esc/qualquer outra tecla sai.
bind Left  select-pane -L \; switch-client -T nav
bind Right select-pane -R \; switch-client -T nav
bind Up    select-pane -U \; switch-client -T nav
bind Down  select-pane -D \; switch-client -T nav
bind -T nav Left  select-pane -L \; switch-client -T nav
bind -T nav Right select-pane -R \; switch-client -T nav
bind -T nav Up    select-pane -U \; switch-client -T nav
bind -T nav Down  select-pane -D \; switch-client -T nav
bind -T nav Any switch-client -T root
# shift+setas pulam entre painéis, sem prefixo (igual em todos os sistemas)
bind -n S-Left select-pane -L
bind -n S-Right select-pane -R
bind -n S-Up select-pane -U
bind -n S-Down select-pane -D
