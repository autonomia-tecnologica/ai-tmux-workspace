# Workspace tmux config (own socket: never touches your normal tmux).
# Read by `workspace`; WS_PROFILE and WS_DIR are exported by `workspace` before this file is read.

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"
# Ghostty: tmux does not detect its synchronized output (sync), so redraws can flicker without this.
set -g terminal-features[100] 'xterm-ghostty:sync:usstyle:overline:strikethrough:hyperlinks:extkeys'
set -g mouse on
set -g escape-time 10
set -g history-limit 50000
set -g base-index 1
set -g renumber-windows on
set -g automatic-rename off
set -g allow-rename off
set -g focus-events on

# borders and status bar (at the top)
set -g pane-border-style "fg=colour238"
# ctrl+b pressed: everything turns orange (border, pane title, bar) until the next key
# focus is shown by a subtle background tint on the active pane (blue; dark orange while ctrl+b/nav is active), and the same tint on the borders around it
set -g pane-active-border-style "fg=colour238,#{?#{||:#{client_prefix},#{==:#{client_key_table},nav}},bg=#2f1d0e,bg=#0f2339}"
set -g window-active-style "#{?#{||:#{client_prefix},#{==:#{client_key_table},nav}},bg=#2f1d0e,bg=#0f2339}"
set -g pane-border-lines heavy
set -g pane-border-status off   # each panel has its own top bar; without status rows the borders are shared lines and light up on both sides
set -g pane-border-indicators off
# i18n texts for the bars are user options (@t_*), set once per load here instead of forking
# python on every status refresh. Synchronous, so they exist before the first draw.
run-shell "python3 ${WS_DIR}/src/i18n.py --tmux"
set -g status on
set -g status-position top
set -g status-interval 5
set -g status-style "bg=colour235,fg=colour250"
set -g status-justify left
set -g status-left-length 200
set -g status-left "#{?#{e|<:#{client_width},100},#[range=user|menu bg=colour208 fg=colour16 bold] #{@t_menu_button} #[norange default] ,}#{?#{==:#{client_key_table},nav},#[bg=colour208 fg=colour16 bold]#{@t_hint_nav}#[default] ,#{?client_prefix,#[bg=colour208 fg=colour16 bold]#{@t_hint_prefix}#[default] ,}}#(python3 ${WS_DIR}/src/statusbar.py '#{@ws_repo}' '#{@ws_profile}' '#{client_width}' '#{@ws_tabs}' '#{@ws_active}' '#{pane_id}')"
set -g status-right-length 60
set -g status-right "#{?#{e|<:#{client_width},100},,#[fg=colour240]#[fg=colour250]#[bold]ctrl+b#[nobold]#[fg=colour244] #{@t_hint_right_options} · #[fg=colour250]#[bold]ctrl+b h#[nobold]#[fg=colour244] #{@t_hint_right_help} #[default]}"
set -g window-status-format ""
set -g window-status-current-format ""
set -g window-status-separator ""

# right side: the top bar (FILES DIFF GITHUB) switches on click, or when it has focus (ctrl+b + arrow): ←→ move, Enter activates
# temporary Claude and terminal tabs (strip above each, with +; t/n/p apply to the focused pane): click switches/creates · ctrl+b t creates · focus on the strip (ctrl+b ↑, Esc): ←→ move, Enter activates · ctrl+b n/p switch
bind t run-shell "${WS_DIR}/bin/workspace tab-new '#{window_id}' '#{@role}'"
bind n run-shell "${WS_DIR}/bin/workspace tab-step '#{window_id}' 1 '#{@role}'"
bind p run-shell "${WS_DIR}/bin/workspace tab-step '#{window_id}' -1 '#{@role}'"
# ctrl+b r reloads this tmux.conf and the tab strip without leaving (same as `workspace reload`)
bind r run-shell -b "${WS_DIR}/bin/workspace reload '#{@ws_profile}' >/dev/null 2>&1" \; display-message "#{@t_reloaded}"
# popups (help, diff, file view) keep the terminal default background (not the pane tint)
set -g popup-style "bg=default"
set -g popup-border-style "fg=colour244"
# ctrl+b h opens i18n/HELP.<locale>.md rendered in a read-only, scrollable popup (Esc or q closes)
bind h display-popup -E -w 92% -h 92% -d "${WS_DIR}" "python3 ${WS_DIR}/src/help.py"
# Fit pane sizes when a client attaches or the terminal is resized (no manual reload needed).
set-hook -g client-attached "run-shell -b \"${WS_DIR}/bin/workspace fit '#{@ws_profile}' >/dev/null 2>&1\""
set-hook -g client-resized "run-shell -b \"${WS_DIR}/bin/workspace fit '#{@ws_profile}' >/dev/null 2>&1\""
# Seamless desktop <-> phone: window-size is "latest", so the window follows whichever client was used last.
# client-active fires on the first touch, key or click of a client that is not the latest one (and focus-in
# covers terminals that report focus), so the layout is fitted to that client before it draws.
set -g window-size latest
set-hook -g client-active "run-shell -b \"${WS_DIR}/bin/workspace fit '#{@ws_profile}' >/dev/null 2>&1\""
set-hook -g client-focus-in "run-shell -b \"${WS_DIR}/bin/workspace fit '#{@ws_profile}' >/dev/null 2>&1\""
# ctrl+b + arrow enters NAVIGATE mode: the arrows keep moving focus (without releasing the prefix
# each time, and without the focused pane stealing the arrows). Enter/Esc/any other key exits.
bind Left  select-pane -L \; switch-client -T nav
bind Right select-pane -R \; switch-client -T nav
bind Up    select-pane -U \; switch-client -T nav
bind Down  select-pane -D \; switch-client -T nav
bind -T nav Left  select-pane -L \; switch-client -T nav
bind -T nav Right select-pane -R \; switch-client -T nav
bind -T nav Up    select-pane -U \; switch-client -T nav
bind -T nav Down  select-pane -D \; switch-client -T nav
bind -T nav Any switch-client -T root
# shift+arrows jump between panes, without the prefix (same on every system)
bind -n S-Left select-pane -L
bind -n S-Right select-pane -R
bind -n S-Up select-pane -U
bind -n S-Down select-pane -D
# ctrl+b o opens the options screen: one popup with every option in an expanded tree (saved prompts, ask Haiku, conference screen between sibling repos, config.yaml "options"); the pick acts on this window's repo / active Claude tab
bind o run-shell "${WS_DIR}/bin/workspace options '#{client_name}' '#{window_id}'"
# Phone layout (narrow window): the hamburger button in the status bar (or ctrl+b m) opens the view menu
bind m run-shell -b "${WS_DIR}/bin/workspace menu '#{client_name}' '#{window_id}'"
bind -n MouseUp1Status if -F '#{==:#{mouse_status_range},menu}' "run-shell -b \"${WS_DIR}/bin/workspace menu '#{client_name}' '#{window_id}'\""
