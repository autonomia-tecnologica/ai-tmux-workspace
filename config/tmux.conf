# Config do tmux do workspace (socket próprio: não mexe no seu tmux normal).
# Lida por `workspace`; ${WS_PERFIL} vem do ambiente de quem iniciou o servidor.

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"
set -g mouse on
set -g escape-time 10
set -g history-limit 50000
set -g base-index 1
set -g renumber-windows on
set -g automatic-rename off
set -g allow-rename off
set -g focus-events on

# bordas e barra de status (em cima)
set -g pane-border-style "fg=colour238"
# ctrl+b pressionado: tudo vira laranja (borda, título do painel, barra) até a próxima tecla
set -g pane-active-border-style "#{?#{||:#{client_prefix},#{==:#{client_key_table},nav}},fg=colour208 bold,fg=colour75}"
set -g pane-border-lines heavy
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#{?#{||:#{client_prefix},#{==:#{client_key_table},nav}},#[bg=colour208 fg=colour16 bold],#[bg=colour75 fg=colour16 bold]},#[fg=colour245]} #{?#{==:#{@papel},},#{pane_index},#{@papel}} #[default]"
set -g pane-border-indicators both
set -g status on
set -g status-position top
set -g status-interval 5
set -g status-style "bg=colour235,fg=colour250"
set -g status-justify left
set -g status-left-length 200
set -g status-left "#{?#{==:#{client_key_table},nav},#[bg=colour208 fg=colour16 bold] NAVEGAR · ←→↑↓ move o foco · Enter/Esc sai #[default] ,#{?client_prefix,#[bg=colour208 fg=colour16 bold] PREFIXO · setas navegar  e arquivos  s sessões  c diff  g github  z zoom #[default] ,}}#(python3 ${WS_DIR}/src/statusbar.py '#{@ws_repo}' '#{@ws_perfil}')"
set -g status-right ""
set -g window-status-format ""
set -g window-status-current-format ""
set -g window-status-separator ""

# lado direito, 4 abas: ctrl+b e arquivos (padrão) · s sessões · c diff · g github
bind e run-shell "${WS_DIR}/bin/workspace side tree '#{window_id}'"
bind s run-shell "${WS_DIR}/bin/workspace side sessions '#{window_id}'"
bind c run-shell "${WS_DIR}/bin/workspace side diff '#{window_id}'"
bind g run-shell "${WS_DIR}/bin/workspace side github '#{window_id}'"
# ctrl+b + seta entra no modo NAVEGAR: as setas seguem movendo o foco (sem soltar o prefixo
# a cada vez, e sem o painel focado roubar as setas). Enter/Esc/qualquer outra tecla sai.
bind Left  select-pane -L \; switch-client -T nav
bind Right select-pane -R \; switch-client -T nav
bind Up    select-pane -U \; switch-client -T nav
bind Down  select-pane -D \; switch-client -T nav
bind -T nav Left  select-pane -L \; switch-client -T nav
bind -T nav Right select-pane -R \; switch-client -T nav
bind -T nav Up    select-pane -U \; switch-client -T nav
bind -T nav Down  select-pane -D \; switch-client -T nav
bind -T nav Any switch-client -T root
# alt+setas pulam entre painéis, sem prefixo
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# persistência: resurrect guarda, continuum salva sozinho a cada 5 min
set -g @resurrect-dir "${HOME}/.local/share/workspace/resurrect-${WS_PERFIL}"
set -g @resurrect-hook-post-restore-all "${WS_DIR}/bin/workspace repair"
set -g @continuum-restore "off"          # quem restaura é o `workspace` (ele sabe o perfil)
set -g @continuum-save-interval "5"
if-shell "test -f ${HOME}/.local/share/workspace/plugins/tmux-resurrect/resurrect.tmux" \
  "run-shell ${HOME}/.local/share/workspace/plugins/tmux-resurrect/resurrect.tmux"
if-shell "test -f ${HOME}/.local/share/workspace/plugins/tmux-continuum/continuum.tmux" \
  "run-shell ${HOME}/.local/share/workspace/plugins/tmux-continuum/continuum.tmux"
